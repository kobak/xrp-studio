<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Isolated Python runtime</title>
  </head>
  <body>
    <script type="module">
      const origin = new URL(location.href).origin;
      const base = new URL(".", location.href).href;
      const url = URL.createObjectURL(
        new Blob(
          [
            `self.__XRP_BASE__=${JSON.stringify(base)};try{importScripts(${JSON.stringify(base + "simulator-worker.js")});}catch(error){postMessage({type:'error',message:String(error.stack || error)});}`,
          ],
          { type: "text/javascript" },
        ),
      );
      const worker = new Worker(url);
      worker.onmessage = (event) =>
        parent.postMessage(
          { channel: "xrp-sandbox", payload: event.data },
          origin,
        );
      worker.onerror = (event) =>
        parent.postMessage(
          {
            channel: "xrp-sandbox",
            payload: {
              type: "worker-error",
              message:
                event.message ||
                "Python worker could not load: " +
                  (event.filename || "opaque-origin worker"),
            },
          },
          origin,
        );
      addEventListener("message", (event) => {
        if (event.source === parent && event.origin === origin)
          worker.postMessage(event.data);
      });
      addEventListener("pagehide", () => {
        worker.terminate();
        URL.revokeObjectURL(url);
      });
    </script>
  </body>
</html>
